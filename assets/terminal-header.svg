<svg width="760" height="200" viewBox="0 0 760 200" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
  <defs>
    <clipPath id="card">
      <rect x="0" y="0" width="760" height="200" rx="14" ry="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="760" height="200" fill="#0D1117"/>
    <rect x="0" y="0" width="760" height="38" fill="#161B22"/>
  </g>
  <rect x="0.5" y="0.5" width="759" height="199" rx="14" ry="14" fill="none" stroke="#30363D"/>

  <circle cx="21" cy="19" r="6" fill="#FF5F56"/>
  <circle cx="41" cy="19" r="6" fill="#FFBD2E"/>
  <circle cx="61" cy="19" r="6" fill="#27C93F"/>
  <text x="380" y="23" font-size="12" fill="#8B949E" text-anchor="middle">aaryan@github — zsh</text>

  <text x="24" y="74" font-size="16" fill="#C9D1D9" opacity="0">
    <tspan fill="#39D353">$</tspan> whoami
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.3s" fill="freeze"/>
  </text>

  <text x="40" y="100" font-size="15" fill="#8B949E" opacity="0">
    &#8594; Aaryan Koradia &#8212; Data Analyst | Software Developer 
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.1s" fill="freeze"/>
  </text>

  <text x="24" y="132" font-size="16" fill="#C9D1D9" opacity="0">
    <tspan fill="#39D353">$</tspan> cat now.txt
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.9s" fill="freeze"/>
  </text>

  <text x="40" y="158" font-size="15" fill="#8B949E" opacity="0">
    &#8594; Building KYROO, an AI-powered life OS on WhatsApp
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.7s" fill="freeze"/>
  </text>

  <text x="24" y="188" font-size="16" fill="#39D353" opacity="0">
    $
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.5s" fill="freeze"/>
  </text>
  <rect x="40" y="175" width="9" height="16" fill="#39D353" opacity="0">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.01;0.5;0.51;1" dur="1s" begin="3.5s" repeatCount="indefinite"/>
  </rect>
</svg>
